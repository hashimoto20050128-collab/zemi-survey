.hw-candy-badge b{font-family:var(--fd);color:var(--pumpkin-d);}
.hw-join-body{padding:8px 16px 50px;}
.hw-wait{text-align:center;padding:20px 0 30px;}
.hw-cheer{font-family:var(--fd);font-weight:800;font-size:22px;color:var(--pumpkin);margin:16px 0 6px;animation:hw-fade .5s;}
@keyframes hw-fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
.hw-qno-line{font-family:var(--fd);font-weight:700;font-size:12px;color:var(--mutedL);margin:12px 0 10px;}
.hw-qtext{font-family:var(--fd);font-weight:800;font-size:clamp(20px,5.4vw,26px);line-height:1.35;margin:0 0 20px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3);}
.hw-choices{display:flex;flex-direction:column;gap:10px;}
.hw-choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:2.5px solid transparent;border-radius:16px;padding:15px 16px;font-family:var(--fb);font-size:16px;font-weight:500;color:var(--ink);cursor:pointer;transition:.14s;box-shadow:0 5px 0 rgba(0,0,0,.14);}
.hw-choice:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.14);}
.hw-choice.on{border-color:var(--pumpkin);}
.hw-choice-t{flex:1;}
.hw-scale-row{display:flex;gap:8px;}
.hw-scalebtn{flex:1;aspect-ratio:1;background:var(--panel);border:2.5px solid transparent;border-radius:14px;font-family:var(--fd);font-weight:800;font-size:20px;color:var(--ink);cursor:pointer;transition:.14s;box-shadow:0 5px 0 rgba(0,0,0,.14);}
.hw-scalebtn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.14);}
.hw-scalebtn.on{border-color:var(--pumpkin);}
.hw-scale-ends{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mutedL);}
.hw-textans{margin-top:2px;}
.hw-answered{background:var(--panel);color:var(--ink);border-radius:16px;padding:18px;box-shadow:0 5px 0 rgba(0,0,0,.14);}
.hw-answered-label{font-family:var(--fd);font-weight:700;font-size:11px;color:var(--muted);margin-bottom:7px;}
.hw-answered-val{font-size:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-bottom:10px;}
.hw-join-results{margin-top:28px;padding-top:18px;border-top:2px dashed rgba(255,255,255,.25);}
.hw-results-label{font-family:var(--fd);font-weight:700;font-size:12px;color:var(--mutedL);margin-bottom:12px;}

/* check-in */
.hw-reg{text-align:center;padding:16px 0 40px;}
.hw-reg-av{font-size:64px;margin:8px 0 14px;animation:hw-bob 3s ease-in-out infinite;}
.hw-reg-input{text-align:center;margin-bottom:14px;}
.hw-costumes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:6px;}
.hw-cos{aspect-ratio:1;font-size:28px;background:var(--panel);border:2.5px solid transparent;border-radius:14px;cursor:pointer;transition:.12s;box-shadow:0 4px 0 rgba(0,0,0,.14);}
.hw-cos:hover{transform:translateY(-2px);}
.hw-cos.on{border-color:var(--pumpkin);background:#fff2e2;}

/* results bars */
.hw-results{display:flex;flex-direction:column;gap:12px;}
.hw-bar-row{display:flex;flex-direction:column;gap:6px;}
.hw-bar-main{display:flex;align-items:center;gap:13px;}
.hw-bar-label{display:flex;align-items:center;gap:8px;width:30%;max-width:240px;min-width:80px;}
.hw-bar-text{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hw-results-big .hw-bar-text{font-size:18px;}
.hw-bar-track{flex:1;position:relative;height:34px;background:#efe6f7;border-radius:999px;overflow:hidden;display:flex;align-items:center;}
.hw-results-big .hw-bar-track{height:46px;}
.hw-bar-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--pumpkin),#ffb259);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1);}
.hw-bar-val{position:relative;margin-left:auto;padding:0 13px;font-family:var(--fd);font-weight:800;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;}
.hw-results-big .hw-bar-val{font-size:20px;}
.hw-bar-c{color:var(--muted);font-size:.8em;}
.hw-avg{font-family:var(--fd);font-weight:700;font-size:14px;color:var(--muted);margin-bottom:6px;display:flex;align-items:baseline;gap:8px;}
.hw-avg b{color:var(--pumpkin-d);font-size:28px;}
.hw-avg-ends{font-family:var(--fb);font-weight:500;font-size:12px;}
.hw-names{display:flex;flex-wrap:wrap;gap:5px;padding-left:calc(30% + 13px);}
.hw-results-big .hw-names{padding-left:0;}
.hw-name-chip{background:#f3ecfb;border:1px solid #e7dcf7;color:#6a5a86;font-size:12px;padding:2px 9px;border-radius:999px;}
.hw-text-results{display:flex;flex-direction:column;gap:10px;max-height:48vh;overflow:auto;}
.hw-text-big{max-height:54vh;}
.hw-text-card{background:var(--panel);color:var(--ink);border-radius:14px;border-left:4px solid var(--pumpkin);padding:12px 15px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.hw-text-big .hw-text-card{font-size:18px;}
.hw-text-name{display:block;font-family:var(--fd);font-weight:700;font-size:12px;color:var(--purple-d);margin-bottom:4px;}
.hw-text-empty{padding:24px 0;color:var(--mutedL);}

/* candy overlays */
.hw-ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;}
.hw-ov-treat{background:radial-gradient(circle,rgba(255,180,90,.22),transparent 60%);}
.hw-ov-steal{background:radial-gradient(circle,rgba(110,53,201,.25),transparent 60%);}
.hw-rain{position:absolute;inset:0;}
.hw-drop{position:absolute;top:-10%;animation-name:hw-drop;animation-timing-function:cubic-bezier(.3,.1,.6,1);animation-fill-mode:both;}
@keyframes hw-drop{0%{transform:translateY(-10vh) rotate(0);opacity:1;}100%{transform:translateY(112vh) rotate(260deg);opacity:.95;}}
.hw-ov-burst{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;animation:hw-burst .5s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes hw-burst{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
.hw-ov-emoji{font-size:72px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));}
.hw-ov-text{font-family:var(--fd);font-weight:800;font-size:clamp(26px,7vw,42px);color:#fff;text-shadow:0 3px 0 var(--pumpkin-d),0 0 20px rgba(0,0,0,.4);}
.hw-ov-delta{font-family:var(--fd);font-weight:800;font-size:26px;padding:4px 16px;border-radius:999px;color:#fff;}
.hw-ov-delta.plus{background:var(--green);color:#1c4d12;}
.hw-ov-delta.minus{background:var(--purple-d);}

/* scare */
.hw-ov-scare{background:rgba(10,4,20,.55);animation:hw-shake .5s;}
@keyframes hw-shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-10px,6px);}40%{transform:translate(9px,-6px);}60%{transform:translate(-7px,-4px);}80%{transform:translate(6px,5px);}}
.hw-scare{text-align:center;animation:hw-zoom .35s cubic-bezier(.2,1.6,.4,1) both;}
@keyframes hw-zoom{0%{transform:scale(.1);opacity:0;}70%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);}}
.hw-scare-face{font-size:clamp(120px,40vw,220px);filter:drop-shadow(0 0 30px rgba(155,92,255,.7));animation:hw-wob .4s ease-in-out 2;}
@keyframes hw-wob{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
.hw-scare-text{font-family:var(--fd);font-weight:800;font-size:clamp(46px,16vw,110px);color:#fff;text-shadow:0 4px 0 var(--purple-d);letter-spacing:.04em;}
.hw-scare-sub{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--mutedL);margin-top:2px;}
/* 脅かしバリエーション */
.hw-ov-scare.s-spider{background:rgba(8,10,4,.7);}
.hw-ov-scare.s-zombie{background:rgba(6,22,8,.72);}
.hw-ov-scare.s-eyes{background:rgba(4,4,20,.82);}
.hw-ov-scare.s-skull{background:rgba(6,6,10,.9);}
.hw-ov-scare.s-skull .hw-scare-face{filter:drop-shadow(0 0 26px rgba(255,255,255,.35));}
.hw-ov-scare.s-blood{background:rgba(70,0,0,.68);animation:hw-shake .5s;}
.hw-ov-scare.s-blood .hw-scare-text{color:#ff2a2a;text-shadow:0 4px 0 #5a0000,0 0 26px rgba(255,0,0,.6);}
.hw-ov-scare.s-blood::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% -20%, transparent 40%, rgba(120,0,0,.55) 100%);}
/* 最恐：赤フラッシュ＋激しい揺れ */
.hw-ov-scare.s-super{animation:hw-flash .16s steps(1) 6, hw-quake .5s 2;}
@keyframes hw-flash{0%{background:rgba(150,0,0,.85);}50%{background:rgba(10,0,0,.92);}100%{background:rgba(150,0,0,.85);}}
@keyframes hw-quake{0%,100%{transform:translate(0,0) rotate(0);}10%{transform:translate(-16px,10px) rotate(-1.5deg);}30%{transform:translate(14px,-12px) rotate(1.5deg);}50%{transform:translate(-14px,-8px) rotate(-1deg);}70%{transform:translate(12px,10px) rotate(1deg);}90%{transform:translate(-8px,6px) rotate(0);}}
.hw-ov-scare.s-super .hw-scare-face{font-size:clamp(150px,52vw,300px);filter:drop-shadow(0 0 40px rgba(255,0,0,.8));animation:hw-wob .22s ease-in-out 4;}
.hw-ov-scare.s-super .hw-scare-text{color:#ff1a1a;text-shadow:0 5px 0 #4a0000,0 0 30px rgba(255,0,0,.8);font-size:clamp(52px,18vw,130px);}
.hw-ov-scare.s-super .hw-scare-sub{color:#ffb3b3;font-size:19px;}

/* 最終ランキング */
.hw-final{background:var(--panel);color:var(--ink);border-radius:24px;padding:24px 22px 26px;box-shadow:0 22px 50px -24px rgba(0,0,0,.6);animation:hw-pop .5s cubic-bezier(.2,1.2,.3,1);}
.hw-final-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;}
.hw-final-crown{font-size:30px;animation:hw-bob 2.6s ease-in-out infinite;}
.hw-final-pumpkin{font-size:28px;}
.hw-final-title{font-family:var(--fd);font-weight:800;font-size:clamp(20px,3.4vw,30px);color:var(--ink);margin:0;}
.hw-podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;max-width:560px;margin:0 auto 10px;}
.hw-podium-col{display:flex;flex-direction:column;align-items:center;gap:4px;}
.hw-podium-col.empty{visibility:hidden;}
.hw-podium-crown{font-size:28px;animation:hw-bob 2.2s ease-in-out infinite;}
.hw-podium-av{font-size:clamp(30px,7vw,46px);}
.hw-podium-name{font-family:var(--fd);font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hw-podium-bar{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;color:#fff;font-family:var(--fd);font-weight:800;font-size:22px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);}
.hw-podium-col.r1 .hw-podium-bar{height:120px;background:linear-gradient(180deg,#FFD23D,#F0A500);}
.hw-podium-col.r2 .hw-podium-bar{height:88px;background:linear-gradient(180deg,#Cfd6de,#9aa6b2);}
.hw-podium-col.r3 .hw-podium-bar{height:66px;background:linear-gradient(180deg,#E6A463,#bd7636);}
.hw-podium-c{font-family:var(--fd);font-weight:800;color:var(--pumpkin-d);margin-top:4px;}
.hw-podium-col.me .hw-podium-name{color:var(--pumpkin-d);}
.hw-final-rest{max-width:460px;margin:12px auto 0;}
.hw-final-me{max-width:460px;margin:14px auto 0;text-align:center;background:#fff2e2;border:2px solid #ffd9b0;border-radius:14px;padding:10px 14px;font-family:var(--fd);font-weight:700;color:var(--ink);}
.hw-final-me b{color:var(--pumpkin-d);font-size:1.2em;}
.hw-rank-row.me{background:#fff2e2;border-radius:10px;}
.hw-rank-row.top .hw-rank-no{font-size:18px;}

@media (prefers-reduced-motion: reduce){
  .hw-root *{animation:none!important;transition:none!important;}
  .hw-drop,.hw-bat,.hw-ghostfloat,.hw-star{display:none;}
}
